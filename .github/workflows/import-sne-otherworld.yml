name: Import SNE OS Otherworld GLB
on:
  push:
    branches: [sne-os-floating-island-v0]
    paths: ['.github/workflows/import-sne-otherworld.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: framechute
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          repository: thanks-cohn/substrate
          ref: main
          path: source-substrate
          persist-credentials: false
      - name: Inspect and install user's Otherworld model
        run: |
          python3 - <<'PY'
          import json,struct
          from pathlib import Path
          src=Path('source-substrate/assets/worlds/otherworld/the_last_stronghold_animated.glb')
          dest=Path('framechute/assets/worlds/otherworld/the_last_stronghold_animated.glb')
          assert src.exists() and src.stat().st_size > 1024, 'Otherworld source GLB unavailable'
          with src.open('rb') as f:
              magic,version,size=struct.unpack('<4sII',f.read(12))
              chunk_size,chunk_type=struct.unpack('<I4s',f.read(8))
              doc=json.loads(f.read(chunk_size))
          assert (magic,version,size,chunk_type)==(b'glTF',2,src.stat().st_size,b'JSON'), 'Invalid GLB'
          print('OTHERWORLD file size:',size,'meshes:',len(doc.get('meshes',[])),'nodes:',len(doc.get('nodes',[])),'materials:',len(doc.get('materials',[])),'animations:',len(doc.get('animations',[])))
          print('OTHERWORLD extensionsRequired:',doc.get('extensionsRequired',[]))
          print('OTHERWORLD extensionsUsed:',doc.get('extensionsUsed',[]))
          for i,node in enumerate(doc.get('nodes',[])[:35]):print('NODE',i,node.get('name'),node.get('mesh'),node.get('translation'),node.get('rotation'),node.get('scale'))
          dest.parent.mkdir(parents=True,exist_ok=True)
          dest.write_bytes(src.read_bytes())
          print('OTHERWORLD copied into:',dest)
          PY
      - name: Commit new GLB to SNE OS development branch
        working-directory: framechute
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/worlds/otherworld/the_last_stronghold_animated.glb
          if ! git diff --cached --quiet; then
            git commit -m 'Import animated Otherworld GLB from SUBSTRATE assets'
            git push origin HEAD:sne-os-floating-island-v0
          fi
