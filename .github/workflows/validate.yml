name: Validate extension

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'))"
      - name: Check JavaScript syntax
        run: find src -name '*.js' -type f -print0 | xargs -0 -n1 node --check
      - name: Run regression tests
        run: node --test tests/*.test.mjs
      - name: Build Chrome Web Store package
        run: sh scripts/package-web-store.sh
      - name: Inspect package
        run: |
          python3 - <<'PY'
          import pathlib
          import zipfile

          archives = list(pathlib.Path('dist').glob('flashframe-chrome-web-store-v*.zip'))
          if len(archives) != 1:
              raise SystemExit(f'Expected one Web Store ZIP, found {len(archives)}')

          with zipfile.ZipFile(archives[0]) as archive:
              names = set(archive.namelist())
              required = {
                  'manifest.json',
                  'LICENSE',
                  'src/remote-video.js',
                  'src/layer-menu.js',
                  'icons/icon128.png',
              }
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f'Missing packaged files: {missing}')
          PY
